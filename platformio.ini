; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:fishbot]
platform = espressif32
board = esp32dev
framework = arduino
; 配置默认波特率
; 配置monitor_speed
monitor_speed = 115200
upload_speed = 115200

; 与主机 ROS2 一致；默认 kilted 会在 dev 阶段 编译 rmw_test_fixture 导致缺 rmw 报错
board_microros_distro = humble
board_build.f_cpu = 240000000L
board_microros_transport = wifi
board_microros_user_meta = custom_microros.meta
; +<*> 编译 src 下全部；-<file> 排除。Arduino 只能有一份 setup()/loop()
build_src_filter = +<*> -<stage1_main.cpp> -<stage2_main.cpp> -<CommHost.cpp>
; Esp32McpwmMotor 使用工程内 lib/（慢衰减），避免与 git 依赖冲突
lib_deps = https://github.com/dogcat0go/fishbot_Esp32PcntEncoder.git
            https://github.com/micro-ROS/micro_ros_platformio.git

; 阶段0裸机验证：stage0_main.cpp（现放在 test/，要跑就先挪回 src/）
; 用法: pio run -e stage0 -t upload && pio device monitor -e stage0
[env:stage0]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.f_cpu = 240000000L
build_src_filter = +<*> -<main.cpp> -<stage1_main.cpp> -<stage2_main.cpp> -<CommHost.cpp>
lib_deps = https://github.com/dogcat0go/fishbot_Esp32PcntEncoder.git

; 阶段1 姿态验证：只用 stage1_main.cpp
; 用法: pio run -e stage1 -t upload && pio device monitor -e stage1
[env:stage1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.f_cpu = 240000000L
build_src_filter = +<*> -<main.cpp> -<stage0_main.cpp> -<stage2_main.cpp> -<CommHost.cpp>
lib_deps = https://github.com/fishros/MPU6050_light.git

; 阶段2/3/4：频带分离 + 平衡 + cmd_vel（micro-ROS WiFi 在 Core0）
; 用法: pio run -e stage2 -t upload && pio device monitor -e stage2
; 电脑端: ros2 run micro_ros_agent micro_ros_agent udp4 --port 8888
;         python3 tools/fishbot_wifi_bridge.py   # /fishbot/log + /fishbot/cmd
;         ros2 topic pub /cmd_vel geometry_msgs/msg/Twist "{linear: {x: 0.1}}"
[env:stage2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.f_cpu = 240000000L
board_microros_distro = humble
board_microros_transport = wifi
board_microros_user_meta = custom_microros.meta
build_src_filter = +<*> -<main.cpp> -<stage0_main.cpp> -<stage1_main.cpp>
; micro-ROS 已在 env:fishbot 编过，复用避免重复 git clone / 重建（外网不通时也能编）
lib_extra_dirs = .pio/libdeps/fishbot
lib_deps = https://github.com/dogcat0go/fishbot_Esp32PcntEncoder.git
            https://github.com/fishros/MPU6050_light.git
            micro_ros_platformio
